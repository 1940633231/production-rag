[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval"
version = "0.1.0"
description = "Reusable evaluation contracts, metrics, runner, and regression gates for RAG systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ir_measures>=0.4,<0.5",
    "pydantic>=2.5,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
