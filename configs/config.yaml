embedding:
  model_name: BAAI/bge-small-zh-v1.5
  normalize: true
  batch_size: 32


vector:
  index_path: data/index/faiss.index
  metadata_path: data/index/metadata.json
  index_type: ivf          # flat（暴力检索）/ ivf（倒排索引）/ hnsw（图索引）
  # IVF 参数
  ivf_nlist: 128             # 聚类中心数（数据量越大应越大，通常 128~4096）
  ivf_nprobe: 16             # 检索时探测的聚类数（越大越精确但越慢）
  # HNSW 参数
  hnsw_m: 16                 # 每个节点的邻居数（内存/精度权衡，通常 16~48）
  hnsw_ef_construction: 200  # 建图时候选池大小（越大建图越慢但质量越好）
  hnsw_ef_search: 64         # 检索时候选池大小（越大越精确但越慢）


chunk:
  chunk_size: 800
  overlap: 120


retrieval:
  top_k: 5


rerank:
  model_name: BAAI/bge-reranker-base
  candidate_pool: 50


context:
  max_context_tokens: 4096      # 模型 context window 总预算
  reserved_tokens: 1024         # 给 query + prompt + answer 预留
  tokenizer_backend: char       # char（默认零依赖）/ tiktoken（需 pip install tiktoken）
  order_strategy: score         # score / document / interleaved
  dedup_span_overlap: 0.5       # 同文档 span 重叠 >= 此值判为重复
  dedup_jaccard: 0.85           # 跨文档 Jaccard >= 此值判为重复
  merge_span_gap: 5             # span 端点 gap <= 此值判为邻接可合并


generation:
  backend: qwen                 # stub（零依赖占位）/ qwen（DashScope API）
  model_name: qwen-turbo        # Qwen 模型名（backend=qwen 时生效）
  api_key_env: DASHSCOPE_API_KEY  # 从环境变量读 API key
  temperature: 0.3              # 生成温度（0=确定，1=随机）
  max_tokens: 1024              # 生成最大 token 数


storage:
  enabled: true               # 向后兼容总开关（等同 backends.mysql.enabled）
  pool_size: 5   # 连接池大小
  # 多后端配置：按需启用，未配置的 backends 默认 false
  backends:
    mysql:
      enabled: true           # MySQL 结构化存储（documents + chunks 表）
      # 连接参数优先从环境变量读取：
  #   MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE
    es:
      enabled: true           # Elasticsearch 全文检索
      # 未设置时使用默认值：127.0.0.1:3306 root@production_rag
    milvus:
      enabled: true         # Milvus 向量存储后端（替代本地 FAISS）
      # Milvus 连接参数（优先级：环境变量 > 此处配置）
      # 环境变量: MILVUS_HOST / MILVUS_PORT / MILVUS_COLLECTION_PREFIX
  # 连接参数优先从环境变量读取：
  #   MILVUS_HOST / MILVUS_PORT / MILVUS_COLLECTION_PREFIX
