# ============================================================
# 认证 / RBAC
# 开启后所有业务 API（chat / knowledge / admin）都需要 JWT 鉴权
# ============================================================
auth:
  enabled: true               # 总开关：false 时跳过鉴权（本地调试）
  jwt_secret: dev-secret-change-me   # JWT 签名密钥（生产必须覆盖）
  jwt_secret_env: JWT_SECRET  # 从环境变量读密钥（优先级 > jwt_secret）
  token_expire_hours: 24      # token 有效期（小时）
  algorithm: HS256            # JWT 签名算法
  # 种子账号（scripts/seed_users.py 使用，未设置时用默认 admin/admin123）
  seed_username: admin
  seed_password: admin123


# ============================================================
# 权限感知查询缓存（Permission-aware Cache）
# 缓存 RAG 问答结果，key 包含 tenant + 权限指纹 + query + 索引版本：
#   - 不同租户 / 不同权限集合的用户不共享缓存（权限隔离）
#   - 权限变更或索引重建后 key 变化，自动失效，不会串数据
# ============================================================
cache:
  enabled: true               # 总开关：false 时每次问答都实时检索
  ttl_seconds: 300            # 缓存有效期（秒），0 表示立即过期（调试用）
  max_entries: 2000           # 最大缓存条目数（内存后端 LRU 上限；Redis 依赖 TTL/服务端淘汰）
  backend: redis              # 缓存后端：redis（优先）/ memory；Redis 不可用时自动降级 memory
  redis:
    # Redis 连接地址从环境变量读取（优先级高于下方默认值）：
    #   REDIS_HOST / REDIS_PORT / REDIS_DB / REDIS_PREFIX
    host: 172.23.97.35        # 默认地址（可被 REDIS_HOST 覆盖）
    port: 6379                # 默认端口（可被 REDIS_PORT 覆盖）
    db: 0                     # 默认逻辑库（可被 REDIS_DB 覆盖）
    password_env: REDIS_PASSWORD  # 可选：从环境变量读 Redis 密码（未设置视为无密码）
    prefix: "rag:qcache:"     # key 前缀（命名空间，便于清理/统计）


# ============================================================
# 审计日志（Audit Log）
# 记录安全相关事件：登录、越权拒绝(401/403)、用户/角色管理、文档操作
# 事件 action 格式 "{类型}.{操作}"，如 login.success / document.upload
# ============================================================
audit:
  enabled: true               # 总开关：false 时不记录任何审计事件
  record: "*"                 # 事件类型白名单："*" 全部 / 逗号分隔如 "login,user,document"


embedding:
  model_name: BAAI/bge-small-zh-v1.5
  normalize: true
  batch_size: 32


vector:
  index_path: data/index/faiss.index
  metadata_path: data/index/metadata.json
  index_type: ivf          # flat（暴力检索）/ ivf（倒排索引）/ hnsw（图索引）
  # IVF 参数
  ivf_nlist: 128             # 聚类中心数（数据量越大应越大，通常 128~4096）
  ivf_nprobe: 16             # 检索时探测的聚类数（越大越精确但越慢）
  # HNSW 参数
  hnsw_m: 16                 # 每个节点的邻居数（内存/精度权衡，通常 16~48）
  hnsw_ef_construction: 200  # 建图时候选池大小（越大建图越慢但质量越好）
  hnsw_ef_search: 64         # 检索时候选池大小（越大越精确但越慢）


chunk:
  chunk_size: 800
  overlap: 120


retrieval:
  top_k: 5
  multi_query: 3            # 多路召回总路数（含原始 query，如 3 = 原始 + 2 个 LLM 扩展），1 表示关闭
  multi_query_auto: false   # 按需启用多路召回：true 时 LLM 先判断该 query 是否需要多路
                            # （需要才扩展；简单单实体问题直接单路，省 LLM 调用/减噪音路）
  # Query Scope（可选能力，默认关闭）：业务驱动 RAG 范围过滤。
  # 适用场景：语料存在"实体竞争"——不同实体（公司/品牌）的语义相近内容
  # （如多家公司财报）互相污染检索结果时，把检索范围限定到目标实体文档集。
  # 无实体竞争（单实体语料）不需要，保持默认关闭即为纯语义检索。
  scope:
    enabled: false            # false：不做业务范围过滤（RAG 默认行为）
    mode: auto                # auto（LLM 从 query 提取实体）/ explicit（仅接收显式传入）
    require_entity: false     # 提取不到实体：false 降级为不过滤 / true 明确报错
    match_top_k: 10           # 实体→文档集：content 匹配的文档召回数


rerank:
  model_name: BAAI/bge-reranker-base
  candidate_pool: 50


context:
  max_context_tokens: 4096      # 模型 context window 总预算
  reserved_tokens: 1024         # 给 query + prompt + answer 预留
  tokenizer_backend: char       # char（默认零依赖）/ tiktoken（需 pip install tiktoken）
  order_strategy: score         # score / document / interleaved
  budget_temperature: 1.0       # 预算加权温度：越小越向高分集中，越大越平均
  dedup_span_overlap: 0.5       # 同文档 span 重叠 >= 此值判为重复
  dedup_jaccard: 0.85           # 跨文档 Jaccard >= 此值判为重复
  merge_span_gap: 5             # span 端点 gap <= 此值判为邻接可合并


generation:
  backend: qwen                 # stub（零依赖占位）/ qwen（DashScope）/ openai（任意 OpenAI 兼容端点）
  model_name: qwen-turbo        # Qwen 模型名（backend=qwen 时生效）
  api_key_env: DASHSCOPE_API_KEY  # 从环境变量读 API key
  temperature: 0.3              # 生成温度（0=确定，1=随机）
  max_tokens: 1024              # 生成最大 token 数
  timeout: 60                   # API 请求超时（秒）
  retry_times: 2                # 网络异常/5xx/429 时的重试次数
  retry_backoff: 1.0            # 重试基础退避秒数（指数退避：1s → 2s）
  max_concurrency: 4            # 最大并发 LLM 调用数（0=不限制），防止占满线程池
  # OpenAI 兼容后端（backend=openai 时生效）：
  #   支持任意 /chat/completions 端点——OpenAI / DeepSeek / Kimi / 智谱 GLM /
  #   阿里百炼 compatible-mode / vLLM / Ollama / 本地推理网关等
  openai:
    base_url: https://api.openai.com/v1   # 端点 base_url（末尾不带 /）
    api_key_env: OPENAI_API_KEY           # API key 环境变量名（如 DEEPSEEK_API_KEY 等）
    model_name: ""                        # 模型名（留空则复用顶层 generation.model_name）


storage:
  enabled: true               # 向后兼容总开关（等同 backends.mysql.enabled）
  pool_size: 5   # 连接池大小
  # 多后端配置：按需启用，未配置的 backends 默认 false
  backends:
    mysql:
      enabled: true           # MySQL 结构化存储（documents + chunks 表）
      # 连接参数优先从环境变量读取：
  #   MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE
    es:
      enabled: true           # Elasticsearch 全文检索
      # 未设置时使用默认值：127.0.0.1:3306 root@production_rag
    milvus:
      enabled: true         # Milvus 向量存储后端（替代本地 FAISS）
      # Milvus 连接参数（优先级：环境变量 > 此处配置）
      # 环境变量: MILVUS_HOST / MILVUS_PORT / MILVUS_COLLECTION_PREFIX
  # 连接参数优先从环境变量读取：
  #   MILVUS_HOST / MILVUS_PORT / MILVUS_COLLECTION_PREFIX
