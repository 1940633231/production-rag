name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run tests with coverage
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # 定时/手动检索评估门禁：C-MTEB T2Retrieval 子集（可复现，无需外部服务）
  # 与入库基线 cmteb_ci_baseline.json 同 seed/同规模对比，指标回退即拦截 PR
  eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Download C-MTEB data
        run: python scripts/download_cmteb.py

      - name: Run C-MTEB gate (compare with baseline)
        run: |
          python scripts/eval_cmteb.py \
            --max-corpus 1500 --max-queries 50 --seed 42 \
            --compare reports/cmteb_ci_baseline.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
