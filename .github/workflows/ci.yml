name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run tests with coverage
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # 定时/手动检索评估：用样例文档重建 FAISS 索引并跑检索评估（无 LLM 依赖）
  # 注意：不与本地基线门禁（CI 数据 ≠ 本地真实数据），仅产出报告供人工检查
  eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Rebuild FAISS index from sample docs
        env:
          MILVUS_ENABLED: "0"
        run: python scripts/rebuild_index.py --strategy recursive

      - name: Run retrieval evaluation (report only)
        env:
          MILVUS_ENABLED: "0"
        run: |
          python scripts/evaluate.py --no-generation --mode retrieval --strategy recursive

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
