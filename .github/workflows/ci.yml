name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:00 Asia/Shanghai
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      eval_scale:
        description: "评测规模: gate（1500/50 与基线对比）/ full（全量 corpus+query，首次 1-2h+，之后命中 embedding 缓存大幅加速）"
        type: choice
        default: gate
        options: [gate, full]
      eval_rerank:
        description: "full 评测启用 rerank（gate 固定不启用，保证与基线可比）"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run tests with coverage
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing

      - name: Install rag-eval
        run: |
          python -m pip install -r requirements-eval-github.txt

      - name: Run rag-eval PR smoke
        run: |
          python -m pytest tests/evaluation/test_eval_adapter.py -q
          rag-eval validate data/evaluation/rag_eval/production_smoke
          rag-eval run \
            --config configs/eval.pr_smoke.yaml \
            --baseline reports/rag-eval/baselines/pr_smoke_fake.json \
            --trend-csv reports/rag-eval/trends/pr-smoke.csv

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # Nightly retrieval gate: new rag-eval platform plus legacy-script consistency.
  eval:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.eval_scale == 'gate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_CORPUS: "1000"
      MAX_QUERIES: "50"
      PRODUCTION_RAG_CMTEB_MAX_CORPUS: "1000"
      PRODUCTION_RAG_CMTEB_MAX_QUERIES: "50"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-eval-github.txt

      - name: Download C-MTEB data
        run: python scripts/download_cmteb.py

      - name: Build rag-eval C-MTEB subset
        run: |
          python scripts/migrate_rag_eval_datasets.py cmteb-50 \
            --max-corpus "$MAX_CORPUS" --max-queries "$MAX_QUERIES" \
            --fill-factor 5 --seed 42

      - name: Compute embedding cache key
        id: cache-key
        run: |
          hash=$(cat \
            data/evaluation/cmteb/C-MTEB/T2Retrieval/data/corpus-*.parquet \
            data/evaluation/cmteb/C-MTEB/T2Retrieval/data/queries-*.parquet \
            data/evaluation/cmteb/C-MTEB/T2Retrieval-qrels/data/dev-*.parquet \
            | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore corpus embeddings
        uses: actions/cache@v4
        id: emb-cache
        with:
          path: data/evaluation/cmteb_cache
          key: cmteb-emb-${{ steps.cache-key.outputs.hash }}-${{ env.MAX_CORPUS }}-${{ env.MAX_QUERIES }}-seed42

      - name: Run new-platform C-MTEB gate
        run: |
          mkdir -p reports/rag-eval/trends
          rag-eval run \
            --config configs/eval.cmteb.yaml \
            --baseline reports/rag-eval/baselines/cmteb_50.json \
            --save-baseline /tmp/platform-cmteb-baseline.json \
            --trend-csv reports/rag-eval/trends/cmteb.csv

      - name: Run legacy C-MTEB evaluation
        run: |
          python scripts/eval_cmteb.py \
            --max-corpus "$MAX_CORPUS" --max-queries "$MAX_QUERIES" --seed 42 \
            --save-baseline /tmp/legacy-cmteb-baseline.json

      - name: Compare legacy and rag-eval metrics
        run: |
          python scripts/compare_eval_metrics.py \
            /tmp/legacy-cmteb-baseline.json \
            /tmp/platform-cmteb-baseline.json \
            --tolerance 0.02

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/

  # 手动全量评测：全量 corpus（11.8 万）+ 全量 query（2.28 万）。
  # 首次需完整编码 corpus（CPU 约 1-2h），embedding 写入 actions/cache，
  # 之后 rerun 命中缓存只做检索+指标，大幅加速；与 gate 基线规模不同，不做对比。
  full-eval:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.eval_scale == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAX_CORPUS: "200000"   # > 全量 corpus 数，即不截断
      MAX_QUERIES: "30000"   # > 全量 query 数，即不截断
      PRODUCTION_RAG_CMTEB_MAX_CORPUS: "200000"
      PRODUCTION_RAG_CMTEB_MAX_QUERIES: "30000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-eval-github.txt

      - name: Download C-MTEB data
        run: python scripts/download_cmteb.py

      - name: Compute embedding cache key
        id: cache-key
        run: |
          hash=$(cat \
            data/evaluation/cmteb/C-MTEB/T2Retrieval/data/corpus-*.parquet \
            data/evaluation/cmteb/C-MTEB/T2Retrieval/data/queries-*.parquet \
            data/evaluation/cmteb/C-MTEB/T2Retrieval-qrels/data/dev-*.parquet \
            | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore corpus embeddings
        uses: actions/cache@v4
        id: emb-cache
        with:
          path: data/evaluation/cmteb_cache
          key: cmteb-emb-${{ steps.cache-key.outputs.hash }}-${{ env.MAX_CORPUS }}-${{ env.MAX_QUERIES }}-seed42

      - name: Run full C-MTEB evaluation
        run: |
          python scripts/eval_cmteb.py \
            --max-corpus ${{ env.MAX_CORPUS }} --max-queries ${{ env.MAX_QUERIES }} --seed 42 \
            ${{ github.event.inputs.eval_rerank == 'true' && '--rerank' || '' }}

      - name: Run full rag-eval C-MTEB baseline
        run: |
          python scripts/migrate_rag_eval_datasets.py cmteb-50 \
            --max-corpus "$MAX_CORPUS" --max-queries "$MAX_QUERIES" \
            --fill-factor 5 --seed 42
          rag-eval run \
            --config configs/eval.cmteb.yaml \
            --save-baseline reports/rag-eval/baselines/cmteb_full.json

      - name: Upload full eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-report
          path: reports/
