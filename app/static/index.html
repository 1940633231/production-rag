<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production RAG 管理台</title>
<style>
  :root { --brand:#2563eb; --bg:#f5f7fa; --card:#fff; --border:#e2e8f0; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:#1e293b; }
  header { background:var(--brand); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; font-weight:600; }
  header .health { font-size:13px; opacity:.95; }
  nav { background:#fff; border-bottom:1px solid var(--border); display:flex; padding:0 24px; }
  nav button { background:none; border:none; padding:12px 18px; font-size:14px; cursor:pointer; color:#64748b; border-bottom:2px solid transparent; }
  nav button.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:15px; margin-bottom:12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  input,select,textarea { padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  input[type=text],select { flex:1; min-width:160px; }
  textarea { width:100%; resize:vertical; font-family:inherit; }
  button { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
  .btn-primary { background:var(--brand); color:#fff; }
  .btn-danger { background:var(--err); color:#fff; }
  .btn-sm { padding:4px 10px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { background:#f8fafc; font-weight:600; }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; }
  .badge.ok { background:#dcfce7; color:var(--ok); }
  .badge.warn { background:#fef3c7; color:var(--warn); }
  .badge.err { background:#fee2e2; color:var(--err); }
  .badge.info { background:#e0f2fe; color:#0284c7; }
  #chat-area { background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:12px; min-height:200px; max-height:400px; overflow-y:auto; font-size:14px; line-height:1.7; }
  .msg { margin-bottom:10px; }
  .msg .role { font-weight:600; margin-right:6px; }
  .msg.user .role { color:var(--brand); }
  .msg.assistant .role { color:var(--ok); }
  .msg .cites { color:#64748b; font-size:12px; }
  .meta { color:#64748b; font-size:12px; margin-top:6px; }
  pre { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:6px; font-size:12px; overflow-x:auto; }
  .muted { color:#94a3b8; font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>📚 Production RAG 管理台</h1>
  <div class="health" id="health-bar">健康检查中…</div>
</header>

<nav id="nav">
  <button class="active" data-panel="chat">💬 问答</button>
  <button data-panel="upload">📤 上传</button>
  <button data-panel="docs">📄 文档</button>
  <button data-panel="index">🗂 索引</button>
  <button data-panel="tasks">⏳ 任务</button>
</nav>

<main>

  <!-- ============ 问答 ============ -->
  <div class="panel active" id="panel-chat">
    <div class="card">
      <h3>RAG 问答</h3>
      <div class="row">
        <input type="text" id="chat-query" placeholder="输入问题，如：铁矿近期供需如何？">
        <select id="chat-strategy">
          <option value="recursive">recursive</option>
          <option value="fixed">fixed</option>
        </select>
        <select id="chat-mode">
          <option value="hybrid">hybrid</option>
          <option value="vector">vector</option>
          <option value="bm25">bm25</option>
        </select>
        <label class="muted"><input type="checkbox" id="chat-rerank" checked> rerank</label>
        <label class="muted"><input type="checkbox" id="chat-stream"> 流式</label>
        <button class="btn-primary" onclick="sendChat()">发送</button>
      </div>
      <div class="row">
        <textarea id="chat-history" rows="3" placeholder="多轮历史（可选，JSON 数组）：[{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;...&quot;},{&quot;role&quot;:&quot;assistant&quot;,&quot;content&quot;:&quot;...&quot;}]"></textarea>
      </div>
      <div id="chat-area"><span class="muted">对话将显示在这里</span></div>
    </div>
  </div>

  <!-- ============ 上传 ============ -->
  <div class="panel" id="panel-upload">
    <div class="card">
      <h3>上传文档</h3>
      <div class="row">
        <input type="file" id="upload-file" accept=".txt,.html,.pdf,.docx">
        <select id="upload-strategy">
          <option value="recursive">recursive</option>
          <option value="fixed">fixed</option>
        </select>
        <label class="muted"><input type="checkbox" id="upload-async"> 后台异步</label>
        <button class="btn-primary" onclick="uploadDoc()">上传</button>
      </div>
      <div id="upload-result"></div>
    </div>
  </div>

  <!-- ============ 文档 ============ -->
  <div class="panel" id="panel-docs">
    <div class="card">
      <h3>文档列表 <button class="btn-sm btn-primary" onclick="loadDocs()">刷新</button></h3>
      <table id="docs-table">
        <thead><tr><th>文件名</th><th>文档 ID</th><th>大小</th><th>chunk 数</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ============ 索引 ============ -->
  <div class="panel" id="panel-index">
    <div class="card">
      <h3>索引状态 <button class="btn-sm btn-primary" onclick="loadStatus()">刷新</button>
        <button class="btn-sm" style="margin-left:12px;background:#334155;color:#fff;" onclick="rebuildIndex('recursive')">重建 recursive</button>
        <button class="btn-sm" style="background:#334155;color:#fff;" onclick="rebuildIndex('fixed')">重建 fixed</button>
      </h3>
      <table id="index-table">
        <thead><tr><th>策略</th><th>FAISS</th><th>metadata</th><th>chunk 数</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ============ 任务 ============ -->
  <div class="panel" id="panel-tasks">
    <div class="card">
      <h3>后台任务 <button class="btn-sm btn-primary" onclick="loadTasks()">刷新</button></h3>
      <table id="tasks-table">
        <thead><tr><th>任务 ID</th><th>类型</th><th>状态</th><th>耗时(s)</th><th>错误</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API = "";
const $ = id => document.getElementById(id);

// ---- 导航切换 ----
document.querySelectorAll("#nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $("panel-" + btn.dataset.panel).classList.add("active");
    if (btn.dataset.panel === "docs") loadDocs();
    if (btn.dataset.panel === "index") loadStatus();
    if (btn.dataset.panel === "tasks") loadTasks();
  };
});

// ---- 健康检查 ----
async function loadHealth() {
  try {
    const r = await fetch(API + "/api/health");
    const d = await r.json();
    const parts = [];
    for (const [k, v] of Object.entries(d.components)) {
      const c = v.status === "ok" ? "ok" : (v.status === "disabled" ? "info" : "err");
      parts.push(`<span class="badge ${c}">${k}:${v.status}</span>`);
    }
    $("health-bar").innerHTML = `<b>${d.status}</b> ${parts.join(" ")}`;
  } catch (e) {
    $("health-bar").innerHTML = `<span class="badge err">服务不可达</span>`;
  }
}

// ---- 问答 ----
async function sendChat() {
  const query = $("chat-query").value.trim();
  if (!query) return alert("请输入问题");
  const stream = $("chat-stream").checked;
  const body = {
    query,
    strategy: $("chat-strategy").value,
    mode: $("chat-mode").value,
    use_rerank: $("chat-rerank").checked,
  };
  const histText = $("chat-history").value.trim();
  if (histText) {
    try { body.history = JSON.parse(histText); }
    catch (e) { return alert("history 不是合法 JSON"); }
  }

  const area = $("chat-area");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  // 引用渲染：编号 + 来源 + 区间 + 部分原文（content_preview）
  const buildCiteHtml = cites => {
    if (!cites || !cites.length) return "";
    return `<div class="cites">引用: ${cites.map(c =>
      `[${c.number}] ${esc(c.file_name)} chunk:${esc(c.chunk_id)} [${c.start_offset}-${c.end_offset}]` +
      (c.content_preview ? `：${esc(c.content_preview)}` : "")
    ).join("<br>")}</div>`;
  };
  const addMsg = (role, text, cites) => {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = `<span class="role">${role === "user" ? "我" : "助手"}</span><span class="content">${text}</span>${buildCiteHtml(cites)}`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  };

  if (stream) {
    // SSE 流式（用独立的 .content 容器累加文本，避免依赖节点顺序）
    addMsg("user", query);
    const div = addMsg("assistant", "");
    const contentSpan = div.querySelector(".content");
    // 解析单个 SSE 事件块（行分隔兼容 \n 与 \r\n）
    const parseChunk = chunk => {
      let event = "message", data = "";
      chunk.split(/\r?\n/).forEach(line => {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data += line.slice(5).trim();
      });
      if (event === "delta" && data) {
        try {
          const d = JSON.parse(data);
          if (d && d.content) contentSpan.textContent += d.content;
        } catch (e) { /* 跳过无法解析的片段 */ }
      } else if (event === "citations" && data) {
        try {
          const arr = JSON.parse(data);
          if (Array.isArray(arr) && arr.length) {
            const old = div.querySelector(".cites");
            if (old) old.remove();
            div.insertAdjacentHTML("beforeend", buildCiteHtml(arr));
            area.scrollTop = area.scrollHeight;
          }
        } catch (e) { /* 跳过无法解析的片段 */ }
      }
    };
    try {
      const resp = await fetch(API + "/api/chat/stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!resp.ok) {
        let msg = "HTTP " + resp.status;
        try {
          const e = await resp.json();
          msg += ": " + (e.detail || JSON.stringify(e));
        } catch (_) { /* 非 JSON 错误体 */ }
        contentSpan.textContent = "流式请求失败: " + msg;
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      // 事件分隔兼容 \r\n\r\n（sse-starlette 默认）与 \n\n 两种格式
      const flush = () => {
        const parts = buf.split(/\r\n\r\n|\n\n/);
        buf = parts.pop(); // 最后一个可能是不完整的事件，留到下一帧
        parts.forEach(parseChunk);
      };
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        flush();
      }
      // 收尾：flush 解码器残留 + 最后一个未带尾分隔的事件
      buf += decoder.decode();
      buf.split(/\r\n\r\n|\n\n/).forEach(parseChunk);
      area.scrollTop = area.scrollHeight;
    } catch (e) {
      contentSpan.textContent = "流式请求失败: " + e;
    }
    return;
  }

  // 同步
  try {
    const r = await fetch(API + "/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json();
      return addMsg("assistant", "请求失败: " + (err.detail || r.status));
    }
    const d = await r.json();
    addMsg("user", query);
    addMsg("assistant", d.answer || "(空)", d.citations);
    const stats = d.stats || {};
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `elapsed=${d.elapsed}s | 改写:${stats.rewritten_query || "-"} | 多路:${stats.query_count || 1} | 合并:${stats.merged_candidates || "-"} | 上下文:${(stats.used_tokens ?? "-")}tok`;
    area.appendChild(meta);
  } catch (e) {
    addMsg("assistant", "请求异常: " + e);
  }
}

// ---- 上传 ----
async function uploadDoc() {
  const file = $("upload-file").files[0];
  if (!file) return alert("请选择文件");
  const form = new FormData();
  form.append("file", file);
  form.append("strategy", $("upload-strategy").value);
  const asyncFlag = $("upload-async").checked;
  const url = API + "/api/knowledge/upload" + (asyncFlag ? "?async_=true" : "");
  const div = $("upload-result");
  div.innerHTML = `<span class="muted">上传中…</span>`;
  try {
    const r = await fetch(url, { method: "POST", body: form });
    const d = await r.json();
    div.innerHTML = `<pre>${JSON.stringify(d, null, 2)}</pre>`;
    if (asyncFlag && d.task_id) setTimeout(loadTasks, 500);
  } catch (e) {
    div.innerHTML = `<span class="badge err">上传失败: ${e}</span>`;
  }
}

// ---- 文档列表 ----
async function loadDocs() {
  try {
    const r = await fetch(API + "/api/knowledge/documents");
    const d = await r.json();
    const tb = $("docs-table").querySelector("tbody");
    tb.innerHTML = "";
    if (!d.documents || !d.documents.length) {
      tb.innerHTML = `<tr><td colspan="5" class="muted">暂无文档</td></tr>`;
      return;
    }
    d.documents.forEach(doc => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${doc.file_name}</td><td>${doc.document_id}</td><td>${doc.content_length}</td>
        <td>${doc.chunk_count || "-"}</td>
        <td><button class="btn-sm btn-danger" onclick="delDoc('${doc.document_id}')">删除</button></td>`;
      tb.appendChild(tr);
    });
  } catch (e) { alert("加载文档失败: " + e); }
}

async function delDoc(id) {
  if (!confirm("确定删除文档 " + id + " ？")) return;
  try {
    const r = await fetch(API + "/api/knowledge/" + encodeURIComponent(id), { method: "DELETE" });
    const d = await r.json();
    alert(JSON.stringify(d, null, 2));
    loadDocs(); loadStatus(); loadTasks();
  } catch (e) { alert("删除失败: " + e); }
}

// ---- 索引状态 ----
async function loadStatus() {
  try {
    const r = await fetch(API + "/api/knowledge/status");
    const d = await r.json();
    const tb = $("index-table").querySelector("tbody");
    tb.innerHTML = "";
    for (const [k, v] of Object.entries(d.indexes)) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${k}</td>
        <td><span class="badge ${v.faiss_exists ? "ok" : "err"}">${v.faiss_exists ? "存在" : "缺失"}</span></td>
        <td><span class="badge ${v.metadata_exists ? "ok" : "err"}">${v.metadata_exists ? "存在" : "缺失"}</span></td>
        <td>${v.chunk_count}</td>`;
      tb.appendChild(tr);
    }
  } catch (e) { alert("加载索引状态失败: " + e); }
}

async function rebuildIndex(strategy) {
  if (!confirm("确定重建 " + strategy + " 索引？")) return;
  try {
    const r = await fetch(API + "/api/knowledge/rebuild", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ strategy }),
    });
    const d = await r.json();
    if (d.task_id) { alert("已提交重建任务: " + d.task_id); setTimeout(loadTasks, 500); }
    else alert(JSON.stringify(d, null, 2));
  } catch (e) { alert("重建失败: " + e); }
}

// ---- 任务列表 ----
async function loadTasks() {
  try {
    const r = await fetch(API + "/api/knowledge/tasks");
    const d = await r.json();
    const tb = $("tasks-table").querySelector("tbody");
    tb.innerHTML = "";
    if (!d.tasks || !d.tasks.length) {
      tb.innerHTML = `<tr><td colspan="5" class="muted">暂无任务</td></tr>`;
      return;
    }
    d.tasks.forEach(t => {
      const badge = t.status === "done" ? "ok" : (t.status === "failed" ? "err" : "warn");
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${t.task_id}</td><td>${t.type}</td>
        <td><span class="badge ${badge}">${t.status}</span></td>
        <td>${t.elapsed ? t.elapsed.toFixed(1) : "-"}</td>
        <td>${t.error || ""}</td>`;
      tb.appendChild(tr);
    });
  } catch (e) { /* ignore */ }
}

// ---- 初始化 ----
loadHealth();
setInterval(loadHealth, 15000);
</script>
</body>
</html>
